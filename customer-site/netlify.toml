# Netlify site A — customer ordering website.
#
# REQUIRED Netlify setting:
#   Site configuration → Build & deploy → Build settings → Base directory
#     customer-site
#
# With the base directory set, Netlify reads THIS file, runs the build inside
# customer-site/, and publishes customer-site/dist. The build command is
# deliberately `node build.mjs` (no `../`): if the base directory is left empty,
# Netlify runs from the repo root and the build stops with a clear
# "build.mjs not found" instead of a confusing parent-path error.
#
# Environment variable:
#   API_BASE_URL = https://api.your-domain.com     # the backend origin
#
# Do not add a netlify.toml at the repo root: the two sites are separated by
# their base directories.

[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

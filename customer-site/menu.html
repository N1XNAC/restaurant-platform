<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete Menu — Maison Verbena</title>
    <meta
      name="description"
      content="Explore Maison Verbena’s complete multi-course dining room menu: Starters, Mains, Wood-Fired specialties, Desserts, and Beverages."
    />
    <meta property="og:title" content="Complete Menu — Maison Verbena" />
    <meta
      property="og:description"
      content="Filter seasonal dishes by course or dietary preference and order directly from your table."
    />
    <meta name="api-base-url" content="" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />

    <script src="js/config.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/session.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/menu.js" defer></script>
    <script src="js/orders.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body data-page="menu">
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" id="header-brand" class="brand-wordmark">Maison Verbena</a>

        <div class="header-center">
          <nav aria-label="Primary navigation" class="primary-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="menu.html" class="nav-link is-active" aria-current="page">Full Menu</a>
            <a href="cart.html" class="nav-link">Table Order</a>
          </nav>

          <div class="header-search-wrap">
            <svg class="header-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input
              type="search"
              id="desktop-search-input"
              placeholder="Search dishes..."
              aria-label="Search menu dishes"
              class="header-search-input"
            />
          </div>
        </div>

        <div class="header-actions">
          <button
            type="button"
            id="mobile-search-toggle"
            class="header-icon-btn mobile-only-control"
            aria-label="Search dishes"
            aria-expanded="false"
            aria-controls="mobile-search-drawer"
          >
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
          </button>

          <button
            type="button"
            id="header-table-btn"
            class="header-chip-btn"
            aria-label="Restaurant information and table verification"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-burgundy);" aria-hidden="true">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4" />
              <path d="M12 8h.01" />
            </svg>
            <span id="header-table-label">Table 08</span>
          </button>

          <a
            href="cart.html"
            id="header-cart-btn"
            class="header-chip-btn"
            aria-label="View virtual table order (0 items)"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-olive);" aria-hidden="true">
              <path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8" />
              <path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7" />
              <path d="m2.1 21.8 6.4-6.3" />
              <path d="m19 5-7 7" />
            </svg>
            <span id="header-cart-count" class="tabular-nums">0</span>
          </a>

          <button
            type="button"
            id="mobile-nav-toggle"
            class="header-icon-btn mobile-only-control"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="mobile-nav-drawer"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="4" x2="20" y1="6" y2="6" />
              <line x1="4" x2="20" y1="12" y2="12" />
              <line x1="4" x2="20" y1="18" y2="18" />
            </svg>
          </button>
        </div>
      </div>

      <div id="mobile-nav-drawer" class="mobile-nav-drawer hidden">
        <nav aria-label="Mobile navigation">
          <ul class="mobile-nav-list">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="menu.html" class="nav-link is-active" aria-current="page">Full Menu</a></li>
            <li><a href="cart.html" class="nav-link">Table Order</a></li>
          </ul>
        </nav>
      </div>

      <div id="mobile-search-drawer" class="mobile-search-drawer hidden">
        <div class="mobile-search-inner">
          <svg class="header-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input
            type="search"
            id="mobile-search-input"
            placeholder="Search dishes, ingredients, or courses..."
            aria-label="Search menu dishes"
            class="mobile-search-input"
          />
        </div>
      </div>
    </header>

    <div id="tamper-alert-container" class="container tamper-alert-wrap hidden"></div>

    <main class="page-shell">
      <div id="session-recovery-container" class="container hidden"></div>

      <div id="page-main-content" class="container animate-page-enter">
        <div class="page-header-band">
          <div>
            <p id="menu-page-kicker" class="page-kicker">
              Table 08 · Full Kitchen Ledger
            </p>
            <h1 class="page-title">Complete Menu</h1>
          </div>

          <div id="dietary-filter-rail" class="filter-pills-row no-scrollbar"></div>
        </div>

        <section aria-label="Menu grouped by culinary course" class="menu-section">
          <div id="menu-grid-container"></div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span id="footer-restaurant-line">
          Maison Verbena · 42 Linden Courtyard, San Francisco, CA 94102
        </span>
        <span id="footer-table-line" class="tabular-nums">
          Table 08 · Window Booth · QR/NFC Verified Ordering
        </span>
      </div>
    </footer>

    <a
      href="cart.html"
      id="floating-cart-btn"
      data-testid="floating-cart-button"
      class="floating-cart-btn"
      aria-label="Open virtual table order review (0 items)"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8" />
        <path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7" />
        <path d="m2.1 21.8 6.4-6.3" />
        <path d="m19 5-7 7" />
      </svg>
      <span
        id="floating-cart-badge"
        data-testid="floating-cart-badge"
        class="floating-cart-badge tabular-nums"
      >
        0
      </span>
    </a>

    <div
      id="toast-banner"
      role="status"
      aria-live="polite"
      class="toast-banner animate-page-enter hidden"
    >
      <span class="toast-check" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </span>
      <span id="toast-message"></span>
      <button
        type="button"
        id="toast-dismiss-btn"
        class="toast-dismiss"
        aria-label="Dismiss notification"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>

    <div
      id="table-session-modal"
      class="modal-backdrop hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="table-session-dialog-title"
    >
      <div class="modal-panel">
        <div class="modal-header">
          <div>
            <p class="modal-kicker">Restaurant &amp; Table Session</p>
            <h2 id="table-session-dialog-title" class="modal-title">Maison Verbena</h2>
          </div>
          <button
            type="button"
            id="modal-close-btn"
            class="modal-close-btn"
            aria-label="Close restaurant information"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
        <div id="table-modal-body"></div>
      </div>
    </div>
  </body>
</html>

# Netlify site #2 — restaurant operations website.
#
# Netlify site settings:
#   Base directory: frontend
#   Build command:  npm run build      (from this file)
#   Publish directory: dist
#
# Environment variable (Site settings → Environment):
#   VITE_API_BASE_URL = https://api.your-domain.com     # the backend origin
#
# The build reads VITE_API_BASE_URL at build time (Vite inlines it), so rebuild
# after changing it.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"